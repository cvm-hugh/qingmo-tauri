<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻墨</title>
<style>
  @font-face { font-family: 'Qingmo LXGW WenKai'; src: url('fonts/LXGWWenKai-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Qingmo LXGW WenKai'; src: url('fonts/LXGWWenKai-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Qingmo Alibaba Health'; src: url('fonts/AlibabaHealthFont2.0CN-45R.ttf') format('truetype'); font-weight: 400; font-style: normal; }
  @font-face { font-family: 'Qingmo Alibaba Health'; src: url('fonts/AlibabaHealthFont2.0CN-85B.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  @font-face { font-family: 'Qingmo Jingnan Bobo Hei'; src: url('fonts/荆南波波黑-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fafafa; --editor-bg: #1e1e2e; --editor-text: #cdd6f4;
    --preview-bg: #fff; --preview-text: #2c2c2c; --border: #e0e0e0;
    --accent: #6366f1; --accent-light: #818cf8;
    --tab-bg: #f0f0f5; --tab-active: #fff; --tab-hover: #e8e8f0;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .tab-bar {
    height: 38px; background: var(--tab-bg); display: flex; align-items: flex-end;
    padding: 0 8px; gap: 2px; flex-shrink: 0; border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: transparent; border: none; border-radius: 8px 8px 0 0;
    font-size: 12px; color: #888; cursor: pointer; transition: all .15s;
    max-width: 180px; min-width: 80px; position: relative; white-space: nowrap;
    font-family: inherit;
  }
  .tab:hover { background: var(--tab-hover); color: #555; }
  .tab.active { background: var(--tab-active); color: #333; font-weight: 600; }
  .tab .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; text-align: left; }
  .tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; display: none; }
  .tab.unsaved .tab-dot { display: inline-block; }
  .tab .tab-close {
    width: 16px; height: 16px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #aaa; background: none; border: none; cursor: pointer; flex-shrink: 0;
    opacity: 0; transition: all .1s;
  }
  .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab .tab-close:hover { background: #fee2e2; color: #dc2626; }
  .tab-new {
    width: 28px; height: 28px; border-radius: 6px; background: none; border: none;
    font-size: 16px; color: #aaa; cursor: pointer; transition: all .15s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tab-new:hover { background: var(--tab-hover); color: var(--accent); }

  .topbar {
    height: 42px; background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
  }
  .topbar .logo { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .topbar .save-status { font-size: 12px; color: #999; display: flex; align-items: center; gap: 4px; }
  .topbar .save-status .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .topbar .save-status .dot.unsaved { background: #f59e0b; }
  .topbar .save-status .dot.saved { background: #10b981; }
  .topbar .file-path { font-size: 11px; color: #aaa; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .hint { font-size: 12px; color: #999; margin-left: auto; }
  .topbar .autosave-toggle {
    display: flex; align-items: center; gap: 4px; font-size: 12px; color: #777;
    white-space: nowrap; user-select: none;
  }
  .topbar .autosave-toggle input { width: 14px; height: 14px; accent-color: var(--accent); }
  .topbar button {
    background: none; border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 12px; font-size: 12px; color: #555; cursor: pointer; transition: all .15s;
  }
  .topbar button:hover { border-color: var(--accent); color: var(--accent); }
  .topbar button.save-btn { border-color: var(--accent); color: var(--accent); }
  .topbar button.save-btn:hover { background: var(--accent); color: #fff; }

  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center;
    z-index: 9999; backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 28px; max-width: 380px; width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); text-align: center;
  }
  .modal-box h3 { font-size: 17px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
  .modal-box p { font-size: 13px; color: #666; margin-bottom: 22px; line-height: 1.5; }
  .modal-box .modal-btns { display: flex; gap: 10px; justify-content: center; }
  .modal-box .modal-btns button {
    padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: none; transition: all .15s;
  }
  .theme-modal-box { max-width: 680px; text-align: left; }
  .theme-modal-box h3 { text-align: center; }
  .theme-modal-box p { text-align: center; }
  .theme-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 12px 0 8px; }
  .theme-help { font-size: 12px; color: #777; line-height: 1.6; background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .theme-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 20px; }
  .theme-card {
    position: relative;
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; background: #fff;
    cursor: pointer; transition: all .15s; min-height: 82px;
  }
  .theme-card:hover { border-color: var(--accent); box-shadow: 0 6px 18px rgba(99,102,241,0.12); }
  .theme-card.active { border-color: var(--accent); background: #f8f7ff; }
  .theme-card.default-theme { box-shadow: inset 3px 0 0 var(--accent); }
  .theme-card .theme-name { font-size: 14px; font-weight: 700; color: #222; margin-bottom: 6px; }
  .theme-card .theme-desc { font-size: 12px; color: #777; line-height: 1.45; }
  .theme-card .theme-badge { display: inline-block; margin-top: 8px; font-size: 10px; color: #666; background: #f3f4f6; padding: 2px 6px; border-radius: 999px; }
  .theme-card .theme-delete {
    position: absolute; right: 8px; top: 8px; border: none; background: #fee2e2; color: #dc2626;
    border-radius: 999px; width: 24px; height: 24px; line-height: 22px; padding: 0; font-size: 14px;
  }
  .theme-card .theme-delete:hover { background: #fecaca; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .btn-secondary { background: #f3f4f6; color: #555; }
  .btn-secondary:hover { background: #e5e7eb; }

  .drop-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(99,102,241,0.08); border: 3px dashed var(--accent);
    display: none; align-items: center; justify-content: center; z-index: 9998;
    font-size: 18px; color: var(--accent); font-weight: 600;
    pointer-events: none;
  }
  .drop-overlay.show { display: flex; }

  .main { flex: 1; display: flex; overflow: hidden; }

  .editor-wrap { width: 50%; display: flex; flex-direction: column; background: var(--editor-bg); }
  .editor-label {
    height: 32px; display: flex; align-items: center; padding: 0 16px;
    font-size: 11px; color: #6c7086; background: #181825; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
  }
  .editor-label .tag { margin-left: auto; background: #313244; color: #a6adc8; padding: 1px 8px; border-radius: 3px; font-size: 10px; }
  #editor {
    flex: 1; background: var(--editor-bg); color: var(--editor-text); border: none; outline: none; resize: none;
    padding: 20px 24px; font-family: 'JetBrains Mono','Fira Code','SF Mono','Consolas',monospace;
    font-size: 14px; line-height: 1.75; tab-size: 2; overflow-y: auto;
  }
  #editor::placeholder { color: #45475a; }
  #editor::-webkit-scrollbar { width: 6px; }
  #editor::-webkit-scrollbar-track { background: transparent; }
  #editor::-webkit-scrollbar-thumb { background: #45475a; border-radius: 3px; }
  .divider { width: 3px; background: var(--border); cursor: col-resize; flex-shrink: 0; transition: background .15s; }
  .divider:hover { background: var(--accent); }
  .preview-wrap { width: 50%; display: flex; flex-direction: column; background: var(--preview-bg); position: relative; }
  .preview-label {
    height: 32px; display: flex; align-items: center; padding: 0 16px;
    font-size: 11px; color: #999; background: #f5f5f5; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
  }
  .preview-label .tag {
    margin-left: auto; background: #eee; color: #888; padding: 1px 8px; border-radius: 3px;
    font-size: 10px; cursor: pointer; transition: all .15s;
  }
  .preview-label .tag:hover { background: var(--accent); color: #fff; }
  .preview-label .tag.paste-on { background: var(--accent); color: #fff; }
  .preview-label .tag.edit-on { background: #10b981; color: #fff; }
  .preview-label button {
    margin-left: 6px; background: #eee; border: none; border-radius: 3px; padding: 1px 6px;
    font-size: 10px; color: #666; cursor: pointer; outline: none;
  }
  .preview-label button:hover { background: var(--accent); color: #fff; }
  #preview {
    flex: 1; padding: 24px 32px; overflow-y: auto; color: var(--preview-text);
    font-size: 15px; line-height: 1.8; transition: outline .2s;
  }
  #preview.paste-mode { outline: 2px dashed var(--accent); outline-offset: -8px; cursor: text; }
  #preview.edit-mode { outline: 2px dashed #10b981; outline-offset: -8px; cursor: text; }
  #preview::-webkit-scrollbar { width: 6px; }
  #preview::-webkit-scrollbar-track { background: transparent; }
  #preview::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }

  #preview h1 { font-size: 26px; font-weight: 700; margin: 20px 0 8px; color: #1a1a1a; border-bottom: 2px solid #eee; padding-bottom: 8px; }
  #preview h2 { font-size: 22px; font-weight: 700; margin: 14px 0 6px; color: #1a1a1a; }
  #preview h3 { font-size: 18px; font-weight: 600; margin: 12px 0 5px; color: #333; }
  #preview h4 { font-size: 16px; font-weight: 600; margin: 10px 0 4px; color: #444; }
  #preview p { margin: 6px 0; }
  #preview strong { font-weight: 700; color: #1a1a1a; }
  #preview em { font-style: italic; }
  #preview mark { background: #fef08a; color: inherit; padding: 1px 4px; border-radius: 3px; }
  #preview u { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent-light); }
  #preview ul, #preview ol { padding-left: 24px; margin: 8px 0; }
  #preview li { margin: 4px 0; }
  #preview li.task-item { list-style: none; margin-left: -20px; }
  #preview li.task-item input[type="checkbox"] { margin-right: 8px; transform: translateY(1px); }
  #preview blockquote { margin: 12px 0; padding: 8px 16px; border-left: 3px solid var(--accent); background: #f8f7ff; color: #555; border-radius: 0 6px 6px 0; }
  #preview blockquote blockquote { border-left-color: #a5b4fc; background: #eef2ff; }
  #preview .list-note { margin: 6px 0; padding: 6px 10px; border-left: 3px solid var(--accent-light); background: #f8f7ff; color: #555; border-radius: 0 5px 5px 0; font-size: .95em; }
  #preview code { background: #f0f0f5; padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono','Fira Code',monospace; font-size: 13px; color: #e11d48; }
  #preview pre { background: #1e1e2e; color: #cdd6f4; padding: 16px 20px; border-radius: 8px; overflow-x: auto; margin: 12px 0; white-space: pre; font-size: 13px; line-height: 1.7; }
  #preview pre code { background: none; color: inherit; padding: 0; font-size: 13px; }
  #preview[class*="style-"] pre code {
    background: none; color: inherit; padding: 0; border-radius: 0;
    font-family: inherit; font-size: inherit; line-height: inherit;
  }
  #preview a { color: var(--accent); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview hr { border: none; border-top: 1px solid #e0e0e0; margin: 20px 0; }
  #preview table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 14px 0; font-size: 14px; border-radius: 8px; overflow: hidden; border: 1px solid #e5e5e5; }
  #preview img { max-width: 100%; height: auto; border-radius: 6px; display: block; margin: 12px 0; }
  #preview thead { background: #f5f3ff; }
  #preview th { padding: 10px 14px; text-align: left; font-weight: 600; color: #3b3b3b; border-bottom: 2px solid #ddd6fe; white-space: nowrap; }
  #preview td { padding: 9px 14px; border-bottom: 1px solid #f0f0f0; color: #444; }
  #preview tbody tr:last-child td { border-bottom: none; }
  #preview tbody tr:hover { background: #faf9ff; }

  #preview.style-user-token {
    font-family: var(--theme-body-font, inherit);
    line-height: var(--theme-line-height, 1.8);
    color: var(--theme-text, var(--preview-text));
    background: var(--theme-background, #fff);
  }
  #preview.style-user-token h1,
  #preview.style-user-token h2,
  #preview.style-user-token h3,
  #preview.style-user-token h4 {
    font-family: var(--theme-heading-font, var(--theme-body-font, inherit));
    font-weight: 700;
  }
  #preview.style-user-token h1 {
    color: var(--theme-h1, var(--theme-heading, #1a1a1a));
    border-bottom: 2px solid var(--theme-border, #eee);
    background: var(--theme-heading-background, transparent);
    padding: 8px 12px;
    border-radius: 0;
  }
  #preview.style-user-token h2 {
    color: var(--theme-h2, var(--theme-heading, #333));
    border-bottom: 1px solid var(--theme-border, #eee);
    padding-bottom: 4px;
  }
  #preview.style-user-token h3 { color: var(--theme-h3, var(--theme-heading, #444)); }
  #preview.style-user-token h4 { color: var(--theme-h4, var(--theme-heading, #555)); }
  #preview.style-user-token strong { color: var(--theme-strong, var(--theme-text, #1a1a1a)); }
  #preview.style-user-token mark { background: var(--theme-highlight, #fef08a); }
  #preview.style-user-token blockquote {
    border-left-color: var(--theme-quote-border, var(--theme-accent, var(--accent)));
    background: var(--theme-quote-background, #f8f7ff);
    color: var(--theme-text, #555);
  }
  #preview.style-user-token .list-note {
    border-left-color: var(--theme-note-border, var(--theme-quote-border, var(--theme-accent, var(--accent))));
    background: var(--theme-note-background, var(--theme-quote-background, #f8f7ff));
    color: var(--theme-note-text, var(--theme-text, #555));
  }
  #preview.style-user-token blockquote blockquote {
    border-left-color: var(--theme-quote-nested-border, var(--theme-quote-border, var(--theme-accent, var(--accent))));
    background: var(--theme-quote-nested-background, var(--theme-quote-background, #eef2ff));
  }
  #preview.style-user-token code {
    color: var(--theme-code-text, var(--theme-accent, #e11d48));
    background: var(--theme-code-background, #f0f0f5);
  }
  #preview.style-user-token pre {
    background: var(--theme-code-block-background, #1e1e2e);
    color: var(--theme-code-block-text, #cdd6f4);
  }
  #preview.style-user-token a { color: var(--theme-link, var(--theme-accent, var(--accent))); }
  #preview.style-user-token table { border-color: var(--theme-table-border, var(--theme-border, #e5e5e5)); }
  #preview.style-user-token thead { background: var(--theme-table-head, #f5f3ff); }
  #preview.style-user-token th {
    border-bottom-color: var(--theme-table-border, var(--theme-border, #ddd6fe));
    color: var(--theme-table-heading, var(--theme-h1, #3b3b3b));
  }
  #preview.style-user-token td {
    border-bottom-color: var(--theme-table-row-border, var(--theme-table-border, #f0f0f0));
    color: var(--theme-text, #444);
  }
  #preview.style-user-token tbody tr:hover { background: var(--theme-table-hover, transparent); }
  #preview.style-user-token li::marker {
    color: var(--theme-marker, var(--theme-accent, currentColor));
    font-family: var(--theme-body-font, inherit);
  }
  #preview.style-user-token li.task-item input[type="checkbox"] { accent-color: var(--theme-marker, var(--theme-accent, var(--accent))); }

  .toolbar {
    height: 36px; background: #181825; display: flex; align-items: center;
    padding: 0 12px; gap: 2px; flex-shrink: 0; border-bottom: 1px solid #313244;
  }
  .toolbar button {
    background: none; border: none; color: #6c7086; padding: 4px 8px; border-radius: 4px;
    font-size: 13px; cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .toolbar button:hover { background: #313244; color: #cdd6f4; }
  .toolbar .sep { width: 1px; height: 16px; background: #313244; margin: 0 4px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1e1e2e; color: #cdd6f4; padding: 10px 20px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: all .3s; pointer-events: none; z-index: 99999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 样式预设 */
  #preview.style-academic { font-family: 'Georgia','Noto Serif SC','Songti SC',serif; line-height: 2; color: #1a1a2e; }
  #preview.style-academic h1 { font-family: 'Georgia','Noto Serif SC',serif; border-bottom: 2px solid #1a1a2e; color: #1a1a2e; }
  #preview.style-academic h2 { font-family: 'Georgia','Noto Serif SC',serif; border-bottom: 1px solid #ccc; padding-bottom: 4px; color: #2d2d44; }
  #preview.style-academic h3 { color: #3d3d5c; }
  #preview.style-academic blockquote { border-left-color: #4a4a6a; background: #f0f0f5; color: #444; }
  #preview.style-academic code { color: #7b2d8e; background: #f3f0f7; }
  #preview.style-academic pre { background: #1a1a2e; color: #e0dce8; }
  #preview.style-academic a { color: #2d5a8e; }
  #preview.style-academic table thead { background: #e8e6f0; }
  #preview.style-academic table th { border-bottom-color: #a8a4c0; color: #1a1a2e; }
  #preview.style-academic strong { color: #0d0d1a; }

  #preview.style-warm { font-family: 'LXGW WenKai','KaiTi','STKaiti',serif; line-height: 1.9; color: #3d2c1e; }
  #preview.style-warm h1 { color: #8b4513; border-bottom-color: #d2b48c; }
  #preview.style-warm h2 { color: #a0522d; }
  #preview.style-warm h3 { color: #b8651a; }
  #preview.style-warm blockquote { border-left-color: #d2b48c; background: #fdf6ec; color: #5a3e28; }
  #preview.style-warm code { color: #c0392b; background: #fdf6ec; }
  #preview.style-warm pre { background: #2d2016; color: #e8d5b7; }
  #preview.style-warm a { color: #b8651a; }
  #preview.style-warm table thead { background: #fdf6ec; }
  #preview.style-warm table th { border-bottom-color: #d2b48c; color: #5a3e28; }
  #preview.style-warm strong { color: #2c1810; }
  #preview.style-warm table { border-color: #d2b48c; }
  #preview.style-warm table td { border-bottom-color: #f0e0c8; }

  #preview.style-seasalt-pineapple { font-family: 'Qingmo LXGW WenKai','LXGW WenKai','KaiTi','STKaiti',serif; line-height: 1.9; color: #243b3a; background: #fefffd; }
  #preview.style-seasalt-pineapple h1 { color: #075f56; border-bottom: 2px solid #99d8cf; background: #f0fbf7; padding: 8px 12px; border-radius: 0; }
  #preview.style-seasalt-pineapple h2 { color: #0b8a7b; border-bottom: 1px solid #d3eee9; padding-bottom: 4px; }
  #preview.style-seasalt-pineapple h3 { color: #14a696; }
  #preview.style-seasalt-pineapple blockquote { border-left-color: #20c7b0; background: #f4fcfa; color: #243b3a; }
  #preview.style-seasalt-pineapple blockquote blockquote { border-left-color: #ffc845; background: #fffdf0; }
  #preview.style-seasalt-pineapple code { color: #0b7f72; background: #f0fbf7; }
  #preview.style-seasalt-pineapple pre { background: #102f35; color: #e9fffb; }
  #preview.style-seasalt-pineapple a { color: #0b8a7b; }
  #preview.style-seasalt-pineapple table { border-color: #a6ded4; }
  #preview.style-seasalt-pineapple table thead { background: #fff8cf; }
  #preview.style-seasalt-pineapple table th { border-bottom-color: #a6ded4; color: #075f56; }
  #preview.style-seasalt-pineapple table td { border-bottom-color: #e2f3ef; }

<script>
// ===== 错误捕获 =====
window.onerror = function(msg, url, line, col, err) {
  console.error('JS ERROR: ' + msg + ' (line ' + line + ')');
  showToast('❌ JS错误: ' + msg);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  console.error('PROMISE ERROR: ' + e.reason);
  showToast('❌ 异步错误: ' + e.reason);
});

// ===== 简易 Markdown 解析器（逐行状态机）=====
var SimpleMD = {
  parse: function(md) {
    // 第一步：按 ``` 分割代码块
    var parts = md.split(/```/);
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        // 文本段 → 逐行状态机解析
        out += SimpleMD.parseBlock(parts[i]);
      } else {
        // 代码段
        var code = parts[i];
        var lang = '';
        var firstNl = code.indexOf('\n');
        if (firstNl > 0) {
          var firstLine = code.substring(0, firstNl).trim();
          if (firstLine && /^[a-zA-Z0-9+#-]+$/.test(firstLine)) {
            lang = firstLine;
            code = code.substring(firstNl + 1);
          }
        }
        code = code.replace(/^\n/, '').replace(/\n$/, '');
        out += '<pre><code>' + SimpleMD.esc(code) + '</code></pre>';
      }
    }
    return out;
  },

  // 逐行状态机：识别标题、引用、表格、列表、段落等块级元素
  parseBlock: function(text) {
    var lines = text.split('\n');
    var out = '';
    var i = 0;
    var safety = 0;

    while (i < lines.length) {
      if (++safety > 50000) break; // 防止死循环
      var line = lines[i];

      // 空行跳过
      if (line.trim() === '') { i++; continue; }

      // 标题
      var hm = line.match(/^(#{1,6})\s+(.+)$/);
      if (hm) {
        out += '<h' + hm[1].length + '>' + SimpleMD.parseInline(hm[2]) + '</h' + hm[1].length + '>';
        i++; continue;
      }

      // 分隔线
      if (/^[-*_]{3,}$/.test(line.trim())) { out += '<hr>'; i++; continue; }

      // >>> 块引用开始（支持内部表格、列表等块级元素）
      if (line.trim() === '>>>') {
        var qLines = [];
        i++;
        while (i < lines.length && lines[i].trim() !== '<<<') { qLines.push(lines[i]); i++; }
        if (i < lines.length) i++; // 跳过 <<<
        out += '<blockquote>' + SimpleMD.parseBlock(qLines.join('\n')) + '</blockquote>';
        continue;
      }

      // 轻墨表格设置：以隐藏注释保存列宽，不影响其他 Markdown 软件阅读。
      var tableMeta = line.match(/^<!--\s*qingmo-table\s+(\{.*\})\s*-->\s*$/);
      if (tableMeta && i + 2 < lines.length && lines[i + 1].includes('|') && /^[\s|:\-]+$/.test(lines[i + 2]) && lines[i + 2].includes('-')) {
        var tableSettings = {};
        try { tableSettings = JSON.parse(tableMeta[1]); } catch (e) {}
        var metaTable = SimpleMD.parseTable(lines, i + 1, tableSettings);
        out += metaTable.html;
        i = metaTable.nextLine;
        continue;
      }

      // 表格：当前行含 | 且下一行是分隔行
      if (line.includes('|') && i + 1 < lines.length && /^[\s|:\-]+$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
        var tRes = SimpleMD.parseTable(lines, i);
        out += tRes.html;
        i = tRes.nextLine;
        continue;
      }

      // > 行引用。首行使用 > 后，直到空行前都归入同一引用，便于跨软件通用。
      if (/^>\s?/.test(line) && line.trim() !== '>>>') {
        var qLines2 = [];
        while (i < lines.length && lines[i].trim() !== '' && lines[i].trim() !== '>>>') {
          if (/^>\s?/.test(lines[i])) {
            qLines2.push(lines[i].replace(/^>\s?/, ''));
          } else {
            qLines2.push(lines[i]);
          }
          i++;
        }
        // 检查 >>> 是否紧跟在 > 后面（嵌套引用，支持内部块级元素）
        if (i < lines.length && lines[i].trim() === '>>>') {
          var nestedLines = [];
          i++; // 跳过 >>>
          while (i < lines.length && lines[i].trim() !== '<<<') { nestedLines.push(lines[i]); i++; }
          if (i < lines.length) i++; // 跳过 <<<
          var outerContent = qLines2.length > 0 ? SimpleMD.parseBlock(qLines2.join('\n')) : '';
          out += '<blockquote>' + outerContent + '<blockquote>' + SimpleMD.parseBlock(nestedLines.join('\n')) + '</blockquote></blockquote>';
        } else {
          out += '<blockquote>' + SimpleMD.parseBlock(qLines2.join('\n')) + '</blockquote>';
        }
        continue;
      }

      // 列表：支持有序/无序/任务列表和缩进层级
      var listMatch = SimpleMD.getListMatch(line);
      if (listMatch) {
        var listRes = SimpleMD.parseList(lines, i, listMatch.indent, listMatch.type);
        out += listRes.html;
        i = listRes.nextLine;
        continue;
      }

      // 普通段落（连续非空行，且不是以上任何块级语法）
      var pLines = [];
      while (i < lines.length && lines[i].trim() !== '' &&
             !/^#{1,6}\s/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) &&
             !/^<!--\s*qingmo-table\s+\{.*\}\s*-->\s*$/.test(lines[i]) &&
             !SimpleMD.getListMatch(lines[i]) &&
             lines[i].trim() !== '>>>' &&
             !/^[-*_]{3,}$/.test(lines[i].trim()) &&
             !(lines[i].includes('|') && i + 1 < lines.length && /^[\s|:\-]+$/.test(lines[i + 1]) && lines[i + 1].includes('-'))) {
        pLines.push(lines[i]);
        i++;
      }
      if (pLines.length > 0) {
        out += '<p>' + SimpleMD.parseInline(pLines.join('\n')) + '</p>';
      }
    }
    return out;
  },

  getListMatch: function(line) {
    var expanded = line.replace(/\t/g, '  ');
    var m = expanded.match(/^(\s*)([-*+])\s+(.*)$/);
    if (m) return { indent: m[1].length, type: 'ul', marker: m[2], text: m[3], start: 1 };
    m = expanded.match(/^(\s*)(\d+)\.\s+(.*)$/);
    if (m) return { indent: m[1].length, type: 'ol', marker: m[2] + '.', text: m[3], start: parseInt(m[2], 10) || 1 };
    return null;
  },

  parseList: function(lines, startIdx, baseIndent, listType) {
    var i = startIdx;
    var items = [];
    var startNum = 1;
    var first = true;

    while (i < lines.length) {
      var m = SimpleMD.getListMatch(lines[i]);
      if (!m || m.indent < baseIndent) break;

      if (m.indent > baseIndent) {
        if (items.length === 0) break;
        var nested = SimpleMD.parseList(lines, i, m.indent, m.type);
        items[items.length - 1] += nested.html;
        i = nested.nextLine;
        continue;
      }

      if (m.type !== listType) break;
      if (first && listType === 'ol') startNum = m.start;
      first = false;

      var task = m.text.match(/^\[( |x|X)\]\s+(.*)$/);
      var liClass = '';
      var checkbox = '';
      var itemText = m.text;
      if (task) {
        liClass = ' class="task-item"';
        checkbox = '<input type="checkbox"' + (task[1].toLowerCase() === 'x' ? ' checked' : '') + '> ';
        itemText = task[2];
      }

      var item = '<li' + liClass + '>' + checkbox + SimpleMD.parseInline(itemText);
      i++;

      while (i < lines.length) {
        var next = SimpleMD.getListMatch(lines[i]);
        if (next && next.indent > baseIndent) {
          var child = SimpleMD.parseList(lines, i, next.indent, next.type);
          item += child.html;
          i = child.nextLine;
        } else if (!next && SimpleMD.isListNoteLine(lines[i], baseIndent)) {
          var noteLines = [];
          while (i < lines.length && SimpleMD.isListNoteLine(lines[i], baseIndent)) {
            noteLines.push(lines[i].replace(/\t/g, '  ').trim().replace(/^>\s?/, ''));
            i++;
          }
          item += '<div class="list-note">' + SimpleMD.parseInline(noteLines.join('\n')) + '</div>';
        } else if (!next && lines[i].trim() !== '' && /^\s{2,}/.test(lines[i].replace(/\t/g, '  '))) {
          item += '<br>' + SimpleMD.parseInline(lines[i].trim());
          i++;
        } else {
          break;
        }
      }

      item += '</li>';
      items.push(item);
    }

    var attrs = listType === 'ol' && startNum !== 1 ? ' start="' + startNum + '"' : '';
    return { html: '<' + listType + attrs + '>' + items.join('') + '</' + listType + '>', nextLine: i };
  },

  isListNoteLine: function(line, baseIndent) {
    var expanded = line.replace(/\t/g, '  ');
    var leading = (expanded.match(/^\s*/) || [''])[0].length;
    return leading > baseIndent && /^>\s?/.test(expanded.trim());
  },

  // 表格解析
  parseTable: function(lines, startIdx, settings) {
    var headers = SimpleMD.parseTableRow(lines[startIdx]);
    var bodyLines = [];
    var i = startIdx + 2; // 跳过表头和分隔行
    while (i < lines.length && lines[i].trim() !== '' && lines[i].includes('|')) {
      bodyLines.push(lines[i]);
      i++;
    }
    var bodyHtml = bodyLines.map(function(row) {
      var cells = SimpleMD.parseTableRow(row);
      return '<tr>' + cells.map(function(c) { return '<td>' + SimpleMD.parseInline(c) + '</td>'; }).join('') + '</tr>';
    }).join('');
    settings = settings && typeof settings === 'object' ? settings : {};
    var layout = settings.layout === 'manual' || settings.layout === 'equal' ? settings.layout : '';
    var widths = Array.isArray(settings.widths) && settings.widths.length === headers.length
      ? settings.widths.map(function(width) { return Math.max(5, Math.min(90, Number(width) || 0)); })
      : null;
    if (widths) {
      var total = widths.reduce(function(sum, width) { return sum + width; }, 0);
      widths = total > 0 ? widths.map(function(width) { return width / total * 100; }) : null;
    }
    var attrs = ' data-qingmo-table="1"';
    if (layout) attrs += ' data-qingmo-layout="' + layout + '"';
    if (widths) attrs += ' data-qingmo-widths="' + widths.map(function(width) { return width.toFixed(3); }).join(',') + '"';
    var colgroup = widths ? '<colgroup>' + widths.map(function(width) { return '<col style="width:' + width.toFixed(3) + '%">'; }).join('') + '</colgroup>' : '';
    var html = '<table' + attrs + '>' + colgroup + '<thead><tr>' + headers.map(function(c) { return '<th>' + SimpleMD.parseInline(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + bodyHtml + '</tbody></table>';
    return { html: html, nextLine: i };
  },

  parseTableRow: function(row) {
    return row.replace(/^\s*\|\s*|\s*\|\s*$/g, '').split('|').map(function(cell) {
      return cell.trim();
    });
  },

  // 行内格式：加粗、斜体、链接、行内代码等
  parseInline: function(text) {
    var html = text;
    // 行内代码（先保护，防止内部被其他规则改写）
    html = html.replace(/`([^`]+)`/g, function(_, code) {
      return '<code>' + SimpleMD.esc(code) + '</code>';
    });
    // 图片、链接
    html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(_, alt, src) {
      return '<img src="' + SimpleMD.imageSrc(src) + '" alt="' + SimpleMD.attr(alt) + '" data-md-src="' + SimpleMD.attr(src) + '">';
    });
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    // 下划线、加粗斜体、加粗、斜体
    html = html.replace(/__(.+?)__/g, '<u>$1</u>');
    html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // 高亮 ::...::
    html = html.replace(/::(.+?)::/g, '<mark>$1</mark>');
    // 换行
    html = html.replace(/\n/g, '<br>');
    return html;
  },

  imageSrc: function(src) {
    src = String(src || '');
    if (/^(https?:|data:)/.test(src)) return SimpleMD.attr(src);
    return 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  },

  attr: function(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  },

  esc: function(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
};

// ===== Tauri API =====
function getTauri() { return window.__TAURI__ || null; }

function waitForTauri(timeout) {
  if (getTauri()) return Promise.resolve(true);
  return new Promise(function(resolve) {
    var start = Date.now();
    var check = setInterval(function() {
      if (getTauri()) { clearInterval(check); resolve(true); }
      else if (Date.now() - start > (timeout || 5000)) { clearInterval(check); resolve(false); }
    }, 100);
  });
}

async function tauriDialogOpen(opts) {
  var t = getTauri();
  if (!t || !t.dialog) { showToast('⚠️ dialog API 不可用'); return null; }
  var result = await t.dialog.open(opts);
  return result;
}

async function tauriDialogSave(opts) {
  var t = getTauri();
  if (!t || !t.dialog) { showToast('⚠️ dialog API 不可用'); return null; }
  var result = await t.dialog.save(opts);
  return result;
}

async function tauriReadTextFile(path) {
  var t = getTauri();
  if (!t || !t.fs) { showToast('⚠️ fs API 不可用'); return null; }
  try {
    var content = await t.fs.readTextFile(path);
    return content;
  } catch (err) {
    var msg = String(err && (err.message || err));
    if (msg.indexOf('os error 60') !== -1 || msg.indexOf('Operation timed out') !== -1) {
      throw new Error('文件读取超时。这个文件可能还在 iCloud/外部盘/同步目录中没有完全下载，请先在 Finder 中打开一次，确认它已落到本机后再导入。');
    }
    throw err;
  }
}

async function tauriWriteTextFile(path, content) {
  var t = getTauri();
  if (!t || !t.fs) { showToast('⚠️ fs API 不可用'); return false; }
  await t.fs.writeTextFile(path, content);
  return true;
}

async function tauriWriteBinaryFile(path, data) {

  await t.fs.writeFile(path, data);
  return true;
}

async function tauriEnsureDir(path) {
  var t = getTauri();
  if (!t || !t.fs || !t.fs.mkdir) throw new Error('fs.mkdir API 不可用');
  await t.fs.mkdir(path, { recursive: true });

async function tauriPathExists(path) {
  var t = getTauri();
  if (!t || !t.fs || !t.fs.exists) return false;
  return !!(await t.fs.exists(path));
}

async function tauriCopyFile(source, destination) {

function defaultExportName(ext) {
  var tab = getActiveTab();
  var name = (tab && tab.name !== '未命名') ? tab.name : '轻墨导出';
  name = name.replace(/\.(md|markdown|txt|pdf|docx)$/i, '');
  return name + ext;
}

async function chooseExportPath(ext, label) {
  var path = await tauriDialogSave({
    title: '导出' + label,
    defaultPath: defaultExportName(ext),
    filters: [{ name: label, extensions: [ext.replace('.', '')] }]
  });
  if (!path) return null;
  if (path.toLowerCase().slice(-ext.length) !== ext) path += ext;

// ===== 标签管理 =====
var tabs = [];
var activeTabId = null;
var tabIdCounter = 0;

var editor = document.getElementById('editor');
var preview = document.getElementById('preview');
var filePathEl = document.getElementById('filePath');
var pasteMode = false;
var editMode = true;
var AUTO_SAVE_STORAGE_KEY = 'qingmo-auto-save-enabled';
var autoSaveEnabled = localStorage.getItem(AUTO_SAVE_STORAGE_KEY) === 'true';

function createTabData(name, path, content) {
  return { id: ++tabIdCounter, name: name || '未命名', path: path || '', content: content || '', unsaved: false, scrollTop: 0 };
}

function newTab(content, name, path) {
  var tab = createTabData(name, path, content);
  tabs.push(tab);
  switchTab(tab.id);
  renderTabs();
  return tab;
}

function switchTab(id) {
  saveCurrentTabState();
  activeTabId = id;
  var tab = getActiveTab();
  if (tab) {
    editor.value = tab.content;
    undoStack = [];
    redoStack = [];
    lastSavedValue = tab.content;
    renderPreview();
    updateFilePath();
    updateSaveStatus();
  }
  renderTabs();
}

function closeTab(id) {
  var idx = tabs.findIndex(function(t) { return t.id === id; });
  if (idx === -1) return;
  var tab = tabs[idx];
  if (tab.unsaved && tab.content.trim()) {
    showSaveModal(function() { removeTab(id); }, '关闭前是否保存「' + tab.name + '」？');
    return;
  }
  removeTab(id);
}

function removeTab(id) {
  var idx = tabs.findIndex(function(t) { return t.id === id; });
  if (idx === -1) return;
  tabs.splice(idx, 1);
  if (tabs.length === 0) { newTab(); return; }
  if (activeTabId === id) {
    var newIdx = Math.min(idx, tabs.length - 1);
    switchTab(tabs[newIdx].id);
  }
  renderTabs();
}

function getActiveTab() { return tabs.find(function(t) { return t.id === activeTabId; }); }

function saveCurrentTabState() {
  var tab = getActiveTab();
  if (tab && editor) { tab.content = editor.value; tab.scrollTop = editor.scrollTop; }
}

function renderTabs() {
  var bar = document.getElementById('tabBar');
  var newBtn = document.getElementById('btnNewTab');
  bar.querySelectorAll('.tab').forEach(function(el) { el.remove(); });
  tabs.forEach(function(tab) {
    var el = document.createElement('button');
    el.className = 'tab' + (tab.id === activeTabId ? ' active' : '') + (tab.unsaved ? ' unsaved' : '');
    el.innerHTML = '<span class="tab-dot"></span><span class="tab-name">' + escHtml(tab.name) + '</span><span class="tab-close" data-id="' + tab.id + '">×</span>';
    el.addEventListener('click', function(e) {
      if (e.target.classList.contains('tab-close')) { closeTab(tab.id); return; }
      switchTab(tab.id);
    });
    bar.insertBefore(el, newBtn);
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== 渲染 =====
var _renderTimer = null;
function scheduleRender() {
  clearTimeout(_renderTimer);
  _renderTimer = setTimeout(function() { renderPreview(); }, 30);
}
editor.addEventListener('input', function() {
  var tab = getActiveTab();
  if (tab) { tab.content = editor.value; tab.unsaved = true; }
  scheduleRender();
  updateSaveStatus();
  scheduleAutoSave();
});

editor.addEventListener('paste', function(e) {
  var imageFile = getClipboardImage(e.clipboardData);
  if (!imageFile) return;
  e.preventDefault();
  insertImageFromClipboard(imageFile, null, { start: editor.selectionStart, end: editor.selectionEnd });
});

function renderPreview() {
  if (pasteMode) return;
  if (editMode && document.activeElement === preview) return;
  var y = preview.scrollTop;
  preview.innerHTML = SimpleMD.parse(editor.value);
  preview.contentEditable = editMode ? 'true' : 'false';
  preview.querySelectorAll('table[data-qingmo-widths]').forEach(function(table) {
    applyTableWidthStyles(table, getTableColumnWidths(table));
  });
  hydratePreviewImages();
  if (editMode) preview.scrollTop = y;
}

function localImagePath(src) {
  src = String(src || '');
  if (/^(https?:|data:)/.test(src)) return '';
  if (/^asset:\/\/localhost\//.test(src)) {
    try { return decodeURIComponent(src.replace(/^asset:\/\/localhost\//, '')); } catch(e0) { return src.replace(/^asset:\/\/localhost\//, ''); }
  }
  if (/^file:\/\//.test(src)) {
    try { return decodeURIComponent(src.substring(7)); } catch(e1) { return src.substring(7); }
  }
  if (src.indexOf('/') === 0) return src;
  var tab = getActiveTab();
  if (!tab || !tab.path) return '';
  return tab.path.substring(0, tab.path.lastIndexOf('/')) + '/' + src.replace(/^\.\//, '');
}

function imageMimeType(path) {
  var ext = String(path || '').split('.').pop().toLowerCase();
  var types = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml' };
  return types[ext] || 'application/octet-stream';
}

async function hydratePreviewImages() {
  var t = getTauri();
  if (!t || !t.fs || !t.fs.readFile) return;
  var images = Array.prototype.slice.call(preview.querySelectorAll('img[data-md-src]'));
  await Promise.all(images.map(async function(image) {
    var source = image.getAttribute('data-md-src') || '';
    var path = localImagePath(source);
    if (!path) return;
    try {
      var bytes = await t.fs.readFile(path);
      if (!image.isConnected || image.getAttribute('data-md-src') !== source) return;
      var previousUrl = image.getAttribute('data-qingmo-blob-url');
      if (previousUrl) URL.revokeObjectURL(previousUrl);
      var url = URL.createObjectURL(new Blob([bytes], { type: imageMimeType(path) }));
      image.setAttribute('data-qingmo-blob-url', url);
      image.src = url;
      image.removeAttribute('data-qingmo-image-error');
    } catch (err) {
      image.setAttribute('data-qingmo-image-error', '1');
      image.alt = '图片加载失败：' + source;
      console.error('图片加载失败:', path, err);
    }
  }));
}

function getTableSettings(table) {
  var settings = {};
  var layout = table && table.getAttribute('data-qingmo-layout');
  if (layout === 'equal' || layout === 'manual') settings.layout = layout;
  var rawWidths = table && table.getAttribute('data-qingmo-widths');
  if (rawWidths) {
    var widths = rawWidths.split(',').map(function(width) { return Number(width); });
    if (widths.length && widths.every(function(width) { return isFinite(width) && width > 0; })) {
      settings.widths = widths.map(function(width) { return Number(width.toFixed(3)); });
    }
  }
  return settings;
}

// ===== HTML → Markdown =====
function htmlToMarkdown(html) {
  var div = document.createElement('div');
  div.innerHTML = html;
  // 先把富文本表格抽出。不同软件复制出的 thead/tbody/样式结构差异很大，
  // 直接递归 DOM 容易漏掉 Markdown 表格必需的分隔行。
  var pastedTables = [];
  Array.prototype.slice.call(div.querySelectorAll('table')).forEach(function(table, index) {
    var token = '@@QINGMO_TABLE_' + index + '@@';
    pastedTables.push({ token: token, markdown: tableToMarkdown(table) });
    table.parentNode.replaceChild(document.createTextNode(token), table);
  });
  var markdown = nodeToMd(div);
  pastedTables.forEach(function(item) {
    markdown = markdown.split(item.token).join(item.markdown);
  });
  return markdown.replace(/\n{3,}/g, '\n\n').trim();

  function nodeToMd(el) {
    var result = '';
    var children = el.childNodes;
    for (var i = 0; i < children.length; i++) {
      var node = children[i];
      if (node.nodeType === 3) {
        result += node.textContent;
      } else if (node.nodeType === 1) {
        var tag = node.tagName.toLowerCase();
        switch (tag) {
          case 'h1': result += '\n# ' + inner(node) + '\n\n'; break;
          case 'h2': result += '\n## ' + inner(node) + '\n\n'; break;
          case 'h3': result += '\n### ' + inner(node) + '\n\n'; break;
          case 'h4': result += '\n#### ' + inner(node) + '\n\n'; break;
          case 'h5': result += '\n##### ' + inner(node) + '\n\n'; break;
          case 'h6': result += '\n###### ' + inner(node) + '\n\n'; break;
          case 'p': result += '\n' + inner(node) + '\n\n'; break;
          case 'br':
            result += node.getAttribute('data-qingmo-blank') === '1' ? '<br>\n' : '\n';
            break;
          case 'hr': result += '\n---\n\n'; break;
          case 'strong': case 'b': result += '**' + inner(node) + '**'; break;
          case 'em': case 'i': result += '*' + inner(node) + '*'; break;
          case 'del': case 's': result += '~~' + inner(node) + '~~'; break;
          case 'code':
            if (node.parentNode && node.parentNode.tagName && node.parentNode.tagName.toLowerCase() === 'pre') {
              result += inner(node);
            } else {
              result += '`' + inner(node) + '`';
            }
            break;
          case 'pre': result += '\n```\n' + inner(node) + '\n```\n\n'; break;
          case 'blockquote': result += '\n> ' + inner(node).replace(/\n/g, '\n> ') + '\n\n'; break;
          case 'a': result += '[' + inner(node) + '](' + (node.getAttribute('href') || '') + ')'; break;
          case 'img': result += '![' + (node.getAttribute('alt') || '') + '](' + (node.getAttribute('data-md-src') || node.getAttribute('src') || '') + ')'; break;
          case 'ul': case 'ol':
            result += '\n' + listToMd(node, 0) + '\n';
            break;
          case 'table':
            result += tableToMarkdown(node);
            break;
          case 'div':
            if (node.classList && node.classList.contains('list-note')) {
              result += inner(node);
              break;
            }
            result += '\n' + inner(node) + '\n';
            break;
          case 'section': case 'article': case 'main': case 'header': case 'footer': case 'nav':
            result += '\n' + inner(node) + '\n';
            break;
          case 'mark': result += '::' + inner(node) + '::'; break;
          case 'span': case 'font': case 'small': case 'sub': case 'sup':
            result += inner(node);
            break;
          default: result += inner(node); break;
        }
      }
    }
    return result;
  }

  function inner(el) {
    if (el.childNodes.length === 0) return '';
    return nodeToMd(el).replace(/^\n+|\n+$/g, '');
  }

  function listToMd(list, depth) {
    var result = '';
    var tag = list.tagName.toLowerCase();
    var index = parseInt(list.getAttribute('start') || '1', 10);
    var children = Array.prototype.filter.call(list.children, function(child) {
      return child.tagName && child.tagName.toLowerCase() === 'li';
    });
    children.forEach(function(li) {
      var nested = Array.prototype.filter.call(li.children, function(child) {
        var t = child.tagName && child.tagName.toLowerCase();
        return t === 'ul' || t === 'ol';
      });
      var notes = Array.prototype.filter.call(li.children, function(child) {
        return child.classList && child.classList.contains('list-note');
      });
      var originalInput = li.querySelector('input[type="checkbox"]');
      var clone = li.cloneNode(true);
      Array.prototype.slice.call(clone.children).forEach(function(child) {
        var t = child.tagName && child.tagName.toLowerCase();
        if (t === 'ul' || t === 'ol' || (child.classList && child.classList.contains('list-note'))) clone.removeChild(child);
      });

      var task = '';
      var input = clone.querySelector('input[type="checkbox"]');
      if (originalInput || input) {
        var checked = originalInput ? originalInput.checked : input.checked;
        task = '[' + (checked ? 'X' : ' ') + '] ';
        if (input) input.remove();
      }

      var text = nodeToMd(clone).replace(/\n+/g, ' ').trim();
      var marker = tag === 'ul' ? '- ' : (index++ + '. ');
      result += Array(depth + 1).join('  ') + marker + task + text + '\n';
      notes.forEach(function(note) {
        var noteText = nodeToMd(note).replace(/^\n+|\n+$/g, '');
        noteText.split('\n').forEach(function(line) {
          result += Array(depth + 2).join('  ') + '> ' + line + '\n';
        });
      });
      nested.forEach(function(child) {
        result += listToMd(child, depth + 1);
      });
    });
    return result;
  }

  function tableToMarkdown(table) {
    var rows = Array.prototype.slice.call(table.querySelectorAll('tr')).map(function(row) {
      return Array.prototype.filter.call(row.children, function(cell) {
        var tag = cell.tagName && cell.tagName.toLowerCase();
        return tag === 'td' || tag === 'th';
      });
    }).filter(function(cells) { return cells.length > 0; });
    if (!rows.length) return '';

    var columnCount = rows.reduce(function(max, cells) { return Math.max(max, cells.length); }, 0);
    var tableSettings = getTableSettings(table);
    var lines = [];
    if (tableSettings.layout || tableSettings.widths) {
      lines.push('<!-- qingmo-table ' + JSON.stringify(tableSettings) + ' -->');
    }
    lines.push(tableRowToMarkdown(rows[0], columnCount));
    lines.push(Array(columnCount).fill('---').join(' | '));
    rows.slice(1).forEach(function(cells) { lines.push(tableRowToMarkdown(cells, columnCount)); });
    return '\n' + lines.join('\n') + '\n\n';
  }

  function tableRowToMarkdown(cells, columnCount) {
    var values = [];
    for (var i = 0; i < columnCount; i++) values.push(cells[i] ? tableCellToMarkdown(cells[i]) : '');
    return values.join(' | ');
  }

  function tableCellToMarkdown(cell) {
    // 表格仍保存为标准 Markdown；单元格内部则保留有限的语义 HTML，
    // 让标题、加粗与真实列表在下一次解析时继续拥有原本的显示结构。
    return serializeTableCell(cell).trim();
  }

  function serializeTableCell(node) {
    var allowed = { h1: true, h2: true, h3: true, h4: true, h5: true, h6: true, p: true, br: true,
      ul: true, ol: true, li: true, strong: true, b: true, em: true, i: true, u: true, mark: true, code: true };
    var result = '';
    Array.prototype.slice.call(node.childNodes).forEach(function(child) {
      if (child.nodeType === 3) {
        result += escapeTableText(child.textContent);
        return;
      }
      if (child.nodeType !== 1) return;
      var tag = child.tagName.toLowerCase();
      var content = serializeTableCell(child);
      if (tag === 'br') { result += '<br>'; return; }
      if (allowed[tag]) result += '<' + tag + '>' + content + '</' + tag + '>';
      else result += content;
    });
    return result;
  }

  function escapeTableText(text) {
    return String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\|/g, '&#124;');
  }
}

// ===== 粘贴模式 =====
var pasteToggle = document.getElementById('pasteToggle');
var editToggle = document.getElementById('editToggle');
var previewUndoTimer = null;

function applyMarkdownFromPreview(toastMsg, options) {
  options = options || {};
  var oldValue = editor.value;
  syncPreviewCheckboxAttributes();
  var md = htmlToMarkdown(preview.innerHTML);
  if (options.recordUndo && md !== oldValue) recordUndoSnapshot(oldValue);
  editor.value = md;
  lastSavedValue = md;
  var tab = getActiveTab();
  if (tab) { tab.content = md; tab.unsaved = true; }
  updateSaveStatus();
  scheduleAutoSave();
  if (toastMsg) showToast(toastMsg);
}

function syncPreviewToEditorAfterCommand() {
  applyMarkdownFromPreview('');
  normalizeOrderedListNumbers();
  var tab = getActiveTab();
  if (tab) { tab.content = editor.value; tab.unsaved = true; }
  updateSaveStatus();
}

function syncPreviewCheckboxAttributes() {
  preview.querySelectorAll('input[type="checkbox"]').forEach(function(input) {
    if (input.checked) input.setAttribute('checked', 'checked');
    else input.removeAttribute('checked');
  });
}

function leavePasteMode(convert) {
  pasteMode = false;
  preview.classList.remove('paste-mode');
  pasteToggle.classList.remove('paste-on');
  pasteToggle.textContent = '📥 粘贴模式';
  preview.contentEditable = editMode ? 'true' : 'false';
  if (convert && preview.innerHTML.trim()) {
    applyMarkdownFromPreview('✅ 已转为 Markdown');
    renderPreview();
  }
}

function leaveEditMode(convert) {
  editMode = false;
  preview.classList.remove('edit-mode');
  editToggle.classList.remove('edit-on');
  editToggle.textContent = '✏️ 编辑模式';
  preview.contentEditable = pasteMode ? 'true' : 'false';
  if (convert) {
    applyMarkdownFromPreview('✅ 预览编辑已同步');
    renderPreview();
  }
}

pasteToggle.addEventListener('click', function() {
  if (!pasteMode && editMode) leaveEditMode(true);
  pasteMode = !pasteMode;
  preview.classList.toggle('paste-mode', pasteMode);
  pasteToggle.classList.toggle('paste-on', pasteMode);
  pasteToggle.textContent = pasteMode ? '📥 粘贴模式 ON' : '📥 粘贴模式';
  preview.contentEditable = pasteMode ? 'true' : 'false';
  if (pasteMode) { preview.innerHTML = ''; showToast('📥 粘贴模式 — 在右侧粘贴富文本'); }
  else if (preview.innerHTML.trim()) {
    applyMarkdownFromPreview('✅ 已转为 Markdown');
    renderPreview();
  }
});

editToggle.addEventListener('click', function() {
  if (!editMode && pasteMode) leavePasteMode(true);
  editMode = !editMode;
  preview.classList.toggle('edit-mode', editMode);
  editToggle.classList.toggle('edit-on', editMode);
  editToggle.textContent = editMode ? '✏️ 编辑模式 ON' : '✏️ 编辑模式';
  preview.contentEditable = editMode ? 'true' : 'false';
  if (editMode) {
    preview.innerHTML = SimpleMD.parse(editor.value);
    preview.focus();
    showToast('✏️ 可在右侧直接编辑');
  } else {
    applyMarkdownFromPreview('✅ 预览编辑已同步');
    renderPreview();
  }
});

preview.addEventListener('input', function() {
  if (!editMode) return;
  if (!previewUndoTimer) {
    recordUndoSnapshot(editor.value);
  }
  clearTimeout(previewUndoTimer);
  previewUndoTimer = setTimeout(function() { previewUndoTimer = null; }, 700);
  applyMarkdownFromPreview('');
});

preview.addEventListener('change', function(e) {
  if (!editMode || !e.target.matches('input[type="checkbox"]')) return;
  recordUndoSnapshot(editor.value);
  setTimeout(function() {
    syncPreviewToEditorAfterCommand();
  }, 0);
});

function getPreviewSelectionBlock() {
  var sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return null;
  var node = sel.anchorNode;
  if (!preview.contains(node)) return null;
  if (node.nodeType === 3) node = node.parentNode;
  while (node && node !== preview) {
    var tag = node.tagName && node.tagName.toLowerCase();
    if (tag === 'li' || tag === 'p' || /^h[1-6]$/.test(tag) || tag === 'blockquote' || tag === 'div') return node;
    node = node.parentNode;
  }
  return node === preview ? preview : null;
}

function isInsidePreviewListItem() {
  var node = getPreviewSelectionBlock();
  while (node && node !== preview) {
    if (node.tagName && node.tagName.toLowerCase() === 'li') return true;
    node = node.parentNode;
  }
  return false;
}

function maybeConvertPreviewMarkdownShortcut(e) {
  if (e.key !== ' ') return false;
  var block = getPreviewSelectionBlock();
  if (!block || block === preview) return false;
  var text = block.textContent.replace(/\u00a0/g, ' ');
  var trimmed = text.trim();
  if (trimmed === '-' || trimmed === '*' || trimmed === '+') {
    e.preventDefault();
    recordUndoSnapshot(editor.value);
    block.textContent = '';
    document.execCommand('insertUnorderedList', false, null);
    syncPreviewToEditorAfterCommand();
    return true;
  }
  if (/^\d+\.$/.test(trimmed)) {
    e.preventDefault();
    recordUndoSnapshot(editor.value);
    block.textContent = '';
    document.execCommand('insertOrderedList', false, null);
    syncPreviewToEditorAfterCommand();
    return true;
  }
  return false;
}

preview.addEventListener('keydown', function(e) {
  if (!editMode) return;
  var mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    doUndo();
    return;
  }
  if (mod && e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault();
    doRedo();
    return;
  }
  if (mod && !e.shiftKey && ['b', 'i', 'u'].indexOf(e.key.toLowerCase()) !== -1) {
    e.preventDefault();
    recordUndoSnapshot(editor.value);
    var commandMap = { b: 'bold', i: 'italic', u: 'underline' };
    try { document.execCommand(commandMap[e.key.toLowerCase()], false, null); } catch(err) {}
    syncPreviewToEditorAfterCommand();
    return;
  }
  if (maybeConvertPreviewMarkdownShortcut(e)) return;
  if (e.key === 'Tab') {
    e.preventDefault();
    recordUndoSnapshot(editor.value);
    if (isInsidePreviewListItem()) {
      var cmd = e.shiftKey ? 'outdent' : 'indent';
      try { document.execCommand(cmd, false, null); } catch(err) {}
    } else {
      try { document.execCommand('insertText', false, '  '); } catch(err2) {}
    }
    syncPreviewToEditorAfterCommand();
  }
});

function plainTextToPasteHtml(text) {
  var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  return lines.map(function(line) {
    return line.trim() === ''
      ? '<br data-qingmo-blank="1">'
      : escHtml(line) + '<br>';
  }).join('');
}

preview.addEventListener('paste', function(e) {
  var imageFile = getClipboardImage(e.clipboardData);
  if (imageFile) {
    e.preventDefault();
    insertImageFromClipboard(imageFile, capturePreviewImageRange());
    return;
  }
  if (!pasteMode) return;
  e.preventDefault();
  var html = e.clipboardData.getData('text/html');
  var text = e.clipboardData.getData('text/plain');
  if (html) { preview.innerHTML = html; }
  else { preview.innerHTML = plainTextToPasteHtml(text); }
  applyMarkdownFromPreview('✅ 已识别内容并同步到 Markdown');
});

// ===== 样式预设 =====
var styleSelect = document.getElementById('styleSelect');
var THEME_STORAGE_KEY = 'qingmo-default-theme';
var USER_THEMES_STORAGE_KEY = 'qingmo-user-themes';
var previewThemeClasses = [
  'style-academic',
  'style-warm',
  'style-seasalt-pineapple',
  'style-black-tea-sweetheart',
  'style-cold-minimal',
  'style-user-token'
];
var builtInThemeOptions = [
  { id: 'default', name: '默认', desc: '轻墨基础预览样式' },
  { id: 'academic', name: '学术', desc: '衬线字体，适合正式文档' },
  { id: 'warm', name: '暖色', desc: '偏暖阅读风格' },
  { id: 'seasalt-pineapple', name: '海盐菠萝', desc: '清爽青绿和轻快讲义感' },
  { id: 'black-tea-sweetheart', name: '红茶甜心', desc: '暖甜亲和，适合课程材料' },
  { id: 'cold-minimal', name: '性冷淡', desc: '低饱和、克制、留白' }
];
var userThemeOptions = [];

function getDefaultTheme() {
  var saved = localStorage.getItem(THEME_STORAGE_KEY) || 'default';
  return getAllThemes().some(function(theme) { return theme.id === saved; }) ? saved : 'default';
}

function themeClassName(theme) {
  return theme && theme.className ? theme.className : ('style-' + (theme && theme.id ? theme.id : 'default'));
}

function getAllThemes() {
  return builtInThemeOptions.concat(userThemeOptions);
}

function findTheme(themeId) {
  return getAllThemes().filter(function(theme) { return theme.id === themeId; })[0] || builtInThemeOptions[0];
}

function normalizeThemeId(value) {
  var id = String(value || '').trim().toLowerCase()
    .replace(/\s+/g, '-')
    .replace(/[^a-z0-9_-]/g, '')
    .replace(/^-+|-+$/g, '');
  return id || ('theme-' + Date.now());
}

function themeCssToScopedCss(theme) {
  var css = String(theme.css || '').trim();
  if (!css && theme.tokens) {
    var t = theme.tokens;
    css = [
      '{{selector}} { font-family: ' + (t.bodyFont || 'inherit') + '; color: ' + (t.text || '#222') + '; background: ' + (t.background || '#fff') + '; line-height: ' + (t.lineHeight || '1.8') + '; }',
      '{{selector}} h1, {{selector}} h2, {{selector}} h3, {{selector}} h4 { font-family: ' + (t.headingFont || t.bodyFont || 'inherit') + '; font-weight: 700; }',
      '{{selector}} h1 { color: ' + (t.h1 || t.heading || t.text || '#222') + '; border-bottom: 2px solid ' + (t.border || '#ddd') + '; background: ' + (t.headingBackground || 'transparent') + '; padding: 8px 12px; }',
      '{{selector}} h2 { color: ' + (t.h2 || t.heading || t.text || '#333') + '; border-bottom: 1px solid ' + (t.border || '#ddd') + '; padding-bottom: 4px; }',
      '{{selector}} h3 { color: ' + (t.h3 || t.heading || t.text || '#444') + '; }',
      '{{selector}} blockquote { border-left-color: ' + (t.quoteBorder || t.accent || '#999') + '; background: ' + (t.quoteBackground || '#f7f7f7') + '; }',
      '{{selector}} .list-note { border-left-color: ' + (t.noteBorder || t.quoteBorder || t.accent || '#999') + '; background: ' + (t.noteBackground || t.quoteBackground || '#f7f7f7') + '; color: ' + (t.noteText || t.text || '#555') + '; }',
      '{{selector}} code { color: ' + (t.codeText || t.accent || '#333') + '; background: ' + (t.codeBackground || '#f3f4f6') + '; }',
      '{{selector}} pre { background: ' + (t.codeBlockBackground || '#1f2937') + '; color: ' + (t.codeBlockText || '#f9fafb') + '; }',
      '{{selector}} mark { background: ' + (t.highlight || '#fff3a3') + '; }',
      '{{selector}} li::marker { color: ' + (t.marker || t.accent || '#555') + '; font-family: ' + (t.bodyFont || 'inherit') + '; }'
    ].join('\n');
  }
  if (!css) return '';
  var selector = '#preview.' + theme.className;
  var dataSelector = '#preview[data-theme-id="' + String(theme.id || '').replace(/"/g, '\\"') + '"]';
  if (css.indexOf('{{selector}}') !== -1) {
    return css.replace(/\{\{selector\}\}/g, selector) + '\n\n' + css.replace(/\{\{selector\}\}/g, dataSelector);
  }
  if (css.indexOf('{{className}}') !== -1) return css.replace(/\{\{className\}\}/g, theme.className);
  if (css.indexOf('#preview') === -1 && css.indexOf('.' + theme.className) === -1) {
    return selector + ' {\n' + css + '\n}\n' + dataSelector + ' {\n' + css + '\n}';
  }
  return css;
}

var THEME_TOKEN_STYLE_MAP = {
  bodyFont: '--theme-body-font',
  headingFont: '--theme-heading-font',
  lineHeight: '--theme-line-height',
  background: '--theme-background',
  text: '--theme-text',
  heading: '--theme-heading',
  h1: '--theme-h1',
  h2: '--theme-h2',
  h3: '--theme-h3',
  h4: '--theme-h4',
  strong: '--theme-strong',
  border: '--theme-border',
  accent: '--theme-accent',
  marker: '--theme-marker',
  highlight: '--theme-highlight',
  link: '--theme-link',
  quoteBorder: '--theme-quote-border',
  quoteBackground: '--theme-quote-background',
  quoteNestedBorder: '--theme-quote-nested-border',
  quoteNestedBackground: '--theme-quote-nested-background',
  noteBackground: '--theme-note-background',
  noteBorder: '--theme-note-border',
  noteText: '--theme-note-text',
  noteMarker: '--theme-note-marker',
  codeText: '--theme-code-text',
  codeBackground: '--theme-code-background',
  codeBlockBackground: '--theme-code-block-background',
  codeBlockText: '--theme-code-block-text',
  headingBackground: '--theme-heading-background',
  tableBorder: '--theme-table-border',
  tableHead: '--theme-table-head',
  tableHeading: '--theme-table-heading',
  tableRowBorder: '--theme-table-row-border',
  tableHover: '--theme-table-hover'
};

function clearUserThemeVars() {
  Object.keys(THEME_TOKEN_STYLE_MAP).forEach(function(key) {
    preview.style.removeProperty(THEME_TOKEN_STYLE_MAP[key]);
  });
}

function applyUserThemeVars(theme) {
  clearUserThemeVars();
  var tokens = theme && theme.tokens ? theme.tokens : null;
  if (!tokens) return false;
  Object.keys(THEME_TOKEN_STYLE_MAP).forEach(function(key) {
    if (tokens[key]) preview.style.setProperty(THEME_TOKEN_STYLE_MAP[key], tokens[key]);
  });
  return true;
}

function loadUserThemes() {
  try {
    var raw = localStorage.getItem(USER_THEMES_STORAGE_KEY);
    var themes = raw ? JSON.parse(raw) : [];
    userThemeOptions = Array.isArray(themes) ? themes.filter(function(theme) {
      return theme && theme.id && theme.name && (theme.css || theme.tokens);
    }) : [];
  } catch (err) {
    userThemeOptions = [];
  }
  userThemeOptions.forEach(function(theme) {
    theme.source = 'user';
    theme.className = theme.className || ('style-user-' + normalizeThemeId(theme.id));
    if (previewThemeClasses.indexOf(theme.className) === -1) previewThemeClasses.push(theme.className);
  });
  refreshUserThemeStyleTag();
  rebuildThemeSelect();
}

function saveUserThemes() {
  localStorage.setItem(USER_THEMES_STORAGE_KEY, JSON.stringify(userThemeOptions));
  refreshUserThemeStyleTag();
  rebuildThemeSelect();
}

function refreshUserThemeStyleTag() {
  var tag = document.getElementById('userThemeStyles');
  if (!tag) {
    tag = document.createElement('style');
    tag.id = 'userThemeStyles';
    document.head.appendChild(tag);
  }
  tag.textContent = userThemeOptions.map(function(theme) { return themeCssToScopedCss(theme); }).join('\n\n');
}

function rebuildThemeSelect() {
  var current = styleSelect.value || getDefaultTheme();
  styleSelect.innerHTML = getAllThemes().map(function(theme) {
    return '<option value="' + SimpleMD.attr(theme.id) + '">' + SimpleMD.esc(theme.name) + '</option>';
  }).join('');
  if (getAllThemes().some(function(theme) { return theme.id === current; })) {
    styleSelect.value = current;
  } else {
    styleSelect.value = 'default';
  }
}

function applyPreviewTheme(themeId) {
  refreshUserThemeStyleTag();
  preview.classList.remove.apply(preview.classList, previewThemeClasses);
  clearUserThemeVars();
  var theme = findTheme(themeId || 'default');
  if (theme.id !== 'default') {
    if (theme.source === 'user' && applyUserThemeVars(theme)) {
      preview.classList.add('style-user-token');
    }
    preview.classList.add(themeClassName(theme));
    preview.setAttribute('data-theme-id', theme.id);
  } else {
    preview.removeAttribute('data-theme-id');
  }
  styleSelect.value = theme.id;
  renderThemeList();
}

styleSelect.addEventListener('change', function() {
  applyPreviewTheme(styleSelect.value);
});

function renderThemeList() {
  var list = document.getElementById('themeList');
  if (!list) return;
  var current = styleSelect.value || 'default';
  var defaultTheme = getDefaultTheme();
  list.innerHTML = getAllThemes().map(function(theme) {
    var active = theme.id === current ? ' active' : '';
    var isDefault = theme.id === defaultTheme ? ' default-theme' : '';
    var isUser = theme.source === 'user';
    var badgeText = theme.id === defaultTheme ? '默认' : (isUser ? '用户主题' : '内置');
    var badge = '<span class="theme-badge">' + badgeText + '</span>';
    var deleteBtn = isUser ? '<button class="theme-delete" data-delete-theme="' + SimpleMD.attr(theme.id) + '" title="删除用户主题">×</button>' : '';
    return '<div class="theme-card' + active + isDefault + '" data-theme-id="' + theme.id + '">' +
      deleteBtn +
      '<div class="theme-name">' + SimpleMD.esc(theme.name) + '</div>' +
      '<div class="theme-desc">' + SimpleMD.esc(theme.desc || '') + '</div>' + badge +
      '</div>';
  }).join('');
  list.querySelectorAll('.theme-card').forEach(function(card) {
    card.addEventListener('click', function() {
      applyPreviewTheme(card.getAttribute('data-theme-id'));
    });
  });
  list.querySelectorAll('.theme-delete').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      deleteUserTheme(btn.getAttribute('data-delete-theme'));
    });
  });
}

function openThemeManager() {
  renderThemeList();
  document.getElementById('themeModal').classList.add('show');
}

function closeThemeManager() {
  document.getElementById('themeModal').classList.remove('show');
}

async function importUserTheme() {
  var path = await tauriDialogOpen({
    multiple: false,
    filters: [{ name: '轻墨主题文件', extensions: ['json'] }]
  });
  if (!path) return;
  try {
    var text = await tauriReadTextFile(path);
    var parsed = JSON.parse(text);
    var theme = Array.isArray(parsed) ? parsed[0] : parsed;
    if (!theme || !theme.name || (!theme.css && !theme.tokens)) {
      showToast('❌ 主题文件缺少 name 和 css/tokens');
      return;
    }
    var id = normalizeThemeId(theme.id || theme.name);
    if (builtInThemeOptions.some(function(item) { return item.id === id; })) {
      id = 'user-' + id;
    }
    theme.id = id;
    theme.name = String(theme.name).trim();
    theme.desc = String(theme.desc || '用户导入主题').trim();
    theme.source = 'user';
    theme.className = 'style-user-' + id;
    userThemeOptions = userThemeOptions.filter(function(item) { return item.id !== id; });
    userThemeOptions.push(theme);
    if (previewThemeClasses.indexOf(theme.className) === -1) previewThemeClasses.push(theme.className);
    saveUserThemes();
    applyPreviewTheme(theme.id);
    showToast('✅ 已导入主题：' + theme.name);
  } catch (err) {
    showToast('❌ 导入主题失败：' + (err && err.message ? err.message : err));
  }
}

function deleteUserTheme(themeId) {
  var theme = userThemeOptions.filter(function(item) { return item.id === themeId; })[0];
  if (!theme) return;
  var wasCurrent = (styleSelect.value === themeId);
  var wasDefault = (getDefaultTheme() === themeId);
  userThemeOptions = userThemeOptions.filter(function(item) { return item.id !== themeId; });
  if (wasDefault) localStorage.removeItem(THEME_STORAGE_KEY);
  saveUserThemes();
  if (wasCurrent || wasDefault) applyPreviewTheme('default');
  else renderThemeList();
  showToast('🗑️ 已删除用户主题：' + theme.name);
}
